server {
 listen 8080 default_server;
 server_name anyps5.games;
 root /usr/share/nginx/html;
 index index.html;
 absolute_redirect off;
 server_tokens off;
 charset utf-8;
 gzip on;
 gzip_types text/css application/javascript application/json application/xml image/svg+xml;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location = /healthz { access_log off; return 200 'ok'; }
 location /_astro/ { try_files $uri =404; expires 1y; }
 location / { try_files $uri $uri/ =404; expires -1; }
 error_page 404 /404.html;
 location = /404.html { internal; }
}
server {
 listen 8080;
 server_name www.anyps5.games;
 return 301 https://anyps5.games$request_uri;
}
