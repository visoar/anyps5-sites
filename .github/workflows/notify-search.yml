name: Notify search engines after publishing
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: search-notifications
  cancel-in-progress: true
jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache/restore@v6.1.0
        with:
          path: .cache/search-notify
          key: search-notify-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: search-notify-v1-
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run search:notify
      - uses: actions/cache/save@v6.1.0
        if: always() && !cancelled() && hashFiles('.cache/search-notify/*.json') != ''
        with:
          path: .cache/search-notify
          key: search-notify-v1-${{ github.run_id }}-${{ github.run_attempt }}
